<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="dtmiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55100;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- D - Rounded modern style -->
  <g>
    <rect x="35" y="45" width="18" height="110" rx="2" fill="url(#dtmiGradient)"/>
    <path d="M 53 45 Q 80 45 80 100 Q 80 155 53 155 L 53 45" fill="url(#dtmiGradient)"/>
  </g>
  
  <!-- T - Clean geometric -->
  <g>
    <rect x="95" y="45" width="50" height="16" rx="2" fill="url(#dtmiGradient)"/>
    <rect x="113" y="61" width="14" height="94" rx="2" fill="url(#dtmiGradient)"/>
  </g>
  
  <!-- M - Angular modern -->
  <g>
    <rect x="155" y="45" width="16" height="110" rx="2" fill="url(#dtmiGradient)"/>
    <polygon points="171,45 185,95 199,45 199,155 183,155 183,85 171,135 159,85 159,155 175,155 175,45" fill="url(#dtmiGradient)"/>
  </g>
  
  <!-- Accent dot for visual interest -->
  <circle cx="100" cy="170" r="4" fill="url(#dtmiGradient)" opacity="0.6"/>
</svg>